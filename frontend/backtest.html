<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1117" />
  <title>Trisigma — Backtest</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="page-backtest">
  <header class="topbar">
    <div class="brand">Trisigma</div>
    <a class="topbar-link" href="/">← Back to chart</a>
    <a class="topbar-link" href="/scanner.html">Scanner</a>
    <a class="topbar-link" href="/settings.html">Settings</a>
    <form id="bt-ticker-form" class="ticker-form">
      <input id="bt-ticker-input" type="text" value="AAPL" autocomplete="off" spellcheck="false" />
      <button type="submit">Load</button>
    </form>
    <div class="bt-page-title">Backtest</div>
  </header>
  <main class="bt-main">
    <section class="bt-panel">
      <h2 class="bt-panel-title">Signal (inherited from chart)</h2>
      <div id="bt-signal-echo" class="bt-signal-echo">—</div>
      <div class="bt-hint">Edit on the <a href="/">chart page</a> to change. Backtest re-reads it on each run.</div>
    </section>

    <section class="bt-panel">
      <h2 class="bt-panel-title">Risk Frame</h2>
      <div class="bt-grid">
        <label>Leverage <input type="number" data-bt="leverage" step="0.5" min="1"></label>
        <label>Stop loss % (option) <input type="number" data-bt="stop_loss_pct" step="0.5" min="0"></label>
        <label>Profit target % (option) <input type="number" data-bt="profit_target_pct" step="1" min="0" placeholder="off"></label>
        <label>Allocation % per trade <input type="number" data-bt="allocation_pct" step="0.5" min="0.5" max="100"></label>
        <label>Time stop (bars) <input type="number" data-bt="time_stop_bars" step="1" min="1"></label>
        <label>Starting $ <input type="number" data-bt="starting_capital" step="100" min="100"></label>
      </div>
      <details class="bt-advanced">
        <summary>Advanced</summary>
        <div class="bt-grid">
          <label title="Blank = disabled. Activates trailing stop once underlying P&L hits this %.">Trail activate % <input type="number" data-bt="trail_activation_pct" step="0.5" placeholder="off"></label>
          <label title="Trail distance from peak in underlying %.">Trail distance % <input type="number" data-bt="trail_distance_pct" step="0.5" placeholder="off"></label>
          <label title="σ-based mean-reversion target (e.g. 0 = exit at line).">TP at σ <input type="number" data-bt="tp_sigma" step="0.1" placeholder="off"></label>
          <label title="σ-based backup stop (e.g. 4 = exit if price hits ±4σ).">SL at ±σ <input type="number" data-bt="sl_sigma" step="0.1" min="0" placeholder="off"></label>
          <label title="Minimum confidence score 0-3 (legacy: MACD/Stoch/Ichimoku).">Min confidence <input type="number" data-bt="min_confidence" min="0" max="3" step="1"></label>
          <label title="Backtest history window.">Period
            <select data-bt="period">
              <option value="2y">2y</option>
              <option value="5y" selected>5y</option>
              <option value="10y">10y</option>
            </select>
          </label>
        </div>
      </details>
    </section>

    <section class="bt-panel">
      <h2 class="bt-panel-title">Run</h2>
      <div class="bt-run-row">
        <button id="bt-run-btn" class="bt-run-btn" type="button">Run Backtest</button>
        <button id="bt-sweep-btn" class="bt-run-btn bt-run-secondary" type="button">Run Sweep</button>
        <label class="bt-sweep-metric">Rank sweep by
          <select id="bt-sweep-metric">
            <option value="sharpe">Sharpe</option>
            <option value="total_return_pct">Total Return</option>
            <option value="profit_factor">Profit Factor</option>
            <option value="win_rate_pct">Win Rate</option>
          </select>
        </label>
      </div>
    </section>

    <section class="bt-panel" id="bt-results-panel" hidden>
      <h2 class="bt-panel-title">Backtest Results</h2>
      <div id="bt-results"></div>
    </section>

    <section class="bt-panel" id="bt-sweep-panel" hidden>
      <h2 class="bt-panel-title">Sweep Results</h2>
      <div id="bt-sweep-info" class="bt-hint"></div>
      <div id="bt-sweep-results"></div>
    </section>
  </main>
  <script src="/backtest.js"></script>
</body>
</html>
