<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Qsig">
  <defs>
    <linearGradient id="qsigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <mask id="qsigSigmaCut">
      <rect width="32" height="32" fill="white"/>
      <circle cx="13" cy="19" r="8" fill="black"/>
      <line x1="17.6" y1="14.5" x2="29" y2="11.2" stroke="black" stroke-width="5" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- regression-channel bands behind the sigma, masked so they don't run through it -->
  <g stroke="url(#qsigGrad)" stroke-width="1.3" stroke-linecap="round" opacity="0.4" fill="none" mask="url(#qsigSigmaCut)">
    <line x1="2" y1="13" x2="30" y2="3"/>
    <line x1="2" y1="22" x2="30" y2="12"/>
    <line x1="2" y1="31" x2="30" y2="21"/>
  </g>
  <!-- sigma: bowl + arm, in the gradient -->
  <g fill="none" stroke="url(#qsigGrad)" stroke-width="2.6" stroke-linecap="round">
    <circle cx="13" cy="19" r="6.5"/>
    <line x1="17.6" y1="14.5" x2="29" y2="11.2"/>
  </g>
</svg>
